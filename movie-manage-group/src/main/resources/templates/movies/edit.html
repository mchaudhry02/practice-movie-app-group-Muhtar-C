<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
    <h1 th:text="${title}">Edit Movie</h1>

    <form th:action="@{/movies/edit/{id}(id=${movie.id})}" th:object="${movie}" method="post" class="mt-3" style="max-width: 500px;">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" th:field="*{title}">
            <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Genre</label>
            <input type="text" class="form-control" th:field="*{genre}">
            <div class="text-danger" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Director</label>
            <input type="text" class="form-control" th:field="*{director}">
        </div>

        <div class="mb-3">
            <label class="form-label">Release Year</label>
            <input type="number" class="form-control" th:field="*{releaseYear}">
            <div class="text-danger" th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}"></div>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" th:field="*{watched}">
            <label class="form-check-label">Watched?</label>
        </div>

        <div class="mb-3">
            <label class="form-label">Rating (1-5)</label>
            <input type="number" min="1" max="5" class="form-control" th:field="*{rating}">
        </div>

        <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" th:field="*{notes}" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a th:href="@{/movies/view/{id}(id=${movie.id})}" class="btn btn-link">Cancel</a>
    </form>
</div>
</body>
</html>
