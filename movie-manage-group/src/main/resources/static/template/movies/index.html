<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 th:text="${title}">My Movie Collection</h1>
        <a class="btn btn-primary" th:href="@{/movies/add}">+ Add Movie</a>
    </div>

    <div th:if="${#lists.isEmpty(movies)}" class="alert alert-info">
        No movies yet. <a th:href="@{/movies/add}">Add your first one!</a>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${!#lists.isEmpty(movies)}">
        <div class="col" th:each="movie : ${movies}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${movie.title}">Title</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${movie.genre} + ' · ' + ${movie.releaseYear}">Genre · Year</h6>
                    <p class="card-text">
                        <span th:if="${movie.watched}" class="badge bg-success">Watched</span>
                        <span th:unless="${movie.watched}" class="badge bg-secondary">Not watched</span>
                        <span th:if="${movie.rating != null}" class="ms-2">
                            <span th:each="i : ${#numbers.sequence(1, movie.rating)}">★</span>
                        </span>
                    </p>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/movies/view/{id}(id=${movie.id})}">View</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/movies/edit/{id}(id=${movie.id})}">Edit</a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/movies/delete/{id}(id=${movie.id})}"
                       onclick="return confirm('Delete this movie?');">Delete</a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
